  <text x="400" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ad6b00" font-weight="700">IBUPROFEN</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#ad6b00" font-weight="900">400mg</text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7f5d18" font-weight="700">NSAID • Pain Relief • Anti-Inflammatory</text>
