  <g>
    <rect x="175" y="430" width="450" height="48" rx="24" fill="#2bb77d"/>
    <text x="400" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" font-weight="800">MINT FLAVOURED BOTTLE</text>
