  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ff5a3c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f5f5f5"/>
  <rect x="70" y="45" width="660" height="510" rx="18" fill="url(#bg)" stroke="#d9482d" stroke-width="4"/>
  <rect x="95" y="87" width="610" height="440" rx="12" fill="#fff3f0" opacity="0.2" stroke="#fff" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#fff" font-weight="700" letter-spacing="2">Dolo</text>
  <text x="400" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" fill="#fff" font-weight="900">650 TABLET</text>
  <text x="400" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffece4" font-weight="600">Paracetamol IP 650mg</text>
