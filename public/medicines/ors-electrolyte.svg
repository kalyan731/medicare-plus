<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="ORS Electrolyte sachet pack">
  <rect width="800" height="600" fill="#eef9ff"/>
  <rect x="70" y="45" width="660" height="510" rx="18" fill="#7fc9ff" stroke="#2b8ed6" stroke-width="4"/>
  <rect x="100" y="90" width="600" height="420" rx="14" fill="#ffffff" opacity="0.9"/>
  <text x="400" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#117acc" font-weight="700">ORS ELECTROLYTE</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" fill="#117acc" font-weight="900">21.8g</text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2b5d86" font-weight="700">WHO Formula • Rapid Rehydration</text>
  <line x1="165" y1="298" x2="635" y2="298" stroke="#b9e1ff" stroke-width="3"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f5d87" font-weight="700">For diarrhea, vomiting &amp; dehydration loss</text>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f5d87" font-weight="600">Dissolve in 1 litre of clean water</text>
  <g>
    <rect x="175" y="430" width="450" height="48" rx="24" fill="#38a6f5"/>
    <text x="400" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" font-weight="800">SINGLE FOIL SACHET</text>
  </g>
  <text x="220" y="545" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1765a8" font-weight="700">FDC LTD.</text>
  <text x="580" y="545" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1765a8" font-weight="700">₹28</text>
</svg>
