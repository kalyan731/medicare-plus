  <text x="400" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff9f6" font-weight="600">For fever, headache, body ache &amp; viral infection</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#fff8f6" font-weight="700">1 tablet 3 times a day as prescribed</text>
