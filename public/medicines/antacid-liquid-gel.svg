<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Antacid liquid gel bottle pack">
  <rect width="800" height="600" fill="#eefaf3"/>
  <rect x="70" y="45" width="660" height="510" rx="18" fill="#6fd6a1" stroke="#2aa86a" stroke-width="4"/>
  <rect x="100" y="92" width="600" height="420" rx="14" fill="#ffffff" opacity="0.92"/>
  <text x="400" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#1e8c5a" font-weight="700">ANTACID LIQUID GEL</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" fill="#1e8c5a" font-weight="900">200ml</text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2f604b" font-weight="700">Acidity • Heartburn • Gas Relief</text>
